name: Publicar o ranking online (Supabase)

# Aplica as migrations e publica a Edge Function do Lumis Run no projeto
# Supabase indicado em jogos/lumis-run/online.json. Segredos necessários
# (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase
#   SUPABASE_DB_PASSWORD   senha do banco do projeto
#   LUMIS_EQUIPE_SENHA     senha da área da equipe no jogo
on:
  push:
    branches: [main]
    paths:
      - supabase/**
      - jogos/lumis-run/online.json
      - .github/workflows/supabase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      LUMIS_EQUIPE_SENHA: ${{ secrets.LUMIS_EQUIPE_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        run: |
          ref=$(jq -r '.projectRef // ""' jogos/lumis-run/online.json)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          missing=""
          [ -z "$ref" ] && missing="$missing projectRef(online.json)"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$LUMIS_EQUIPE_SENHA" ] && missing="$missing LUMIS_EQUIPE_SENHA"
          if [ -n "$missing" ]; then
            echo "::warning::Ranking online ainda não configurado. Falta:$missing. Nada foi publicado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Banco (migrations)
        if: steps.cfg.outputs.skip != 'true'
        run: |
          supabase link --project-ref "${{ steps.cfg.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Senha da equipe
        if: steps.cfg.outputs.skip != 'true'
        run: supabase secrets set --project-ref "${{ steps.cfg.outputs.ref }}" LUMIS_EQUIPE_SENHA="$LUMIS_EQUIPE_SENHA"

      - name: Função do ranking
        if: steps.cfg.outputs.skip != 'true'
        run: supabase functions deploy lumis-run --project-ref "${{ steps.cfg.outputs.ref }}" --no-verify-jwt

      - name: Teste rápido
        if: steps.cfg.outputs.skip != 'true'
        run: |
          curl -fsS "https://${{ steps.cfg.outputs.ref }}.supabase.co/functions/v1/lumis-run/ranking" | head -c 300
